[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-fcs-sampler"
version = "0.1.0"
description = "Read selected raw FCS cell events without loading the entire file"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fast FCS Sampler contributors"}]
dependencies = ["numpy>=1.23"]
keywords = ["FCS", "flow cytometry", "CyTOF", "sampling", "memmap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/JaesikKim/fast-fcs-sampler"
Repository = "https://github.com/JaesikKim/fast-fcs-sampler"
Issues = "https://github.com/JaesikKim/fast-fcs-sampler/issues"

[tool.setuptools.packages.find]
where = ["src"]
